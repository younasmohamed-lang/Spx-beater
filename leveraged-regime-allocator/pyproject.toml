[project]
name = "leveraged-regime-allocator"
version = "0.1.0"
description = "Leveraged S&P 500 allocator driven by volatility-regime and path-dependency signals"
requires-python = ">=3.12"
dependencies = [
    # core
    "pydantic-settings>=2.3",
    "loguru>=0.7",
    # data
    "pandas>=2.2",
    "polars>=0.20",
    "numpy>=1.26",
    "yfinance>=0.2",
    "requests>=2.32",
    # modelling
    "hmmlearn>=0.3",
    "arch>=6.3",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "numba>=0.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "pandas-stubs>=2.2",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/allocator"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"notebooks/**" = ["ANN", "E402"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "hmmlearn.*", "arch.*", "numba.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=allocator --cov-report=term-missing --cov-fail-under=80"
